name: Deploy

# Runs when commits land on main (e.g. a PR being merged).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow's GITHUB_TOKEN to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # gh-pages clones into its own temp dir, so it can't use the checkout's
      # persisted auth. Give it an authenticated remote URL with the workflow token.
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx gh-pages -d build --cname ereneri.dev
          -u "GitHub Actions <actions@github.com>"
          -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
