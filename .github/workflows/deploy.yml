name: Deploy

# Runs when commits land on main (e.g. a PR being merged).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow's GITHUB_TOKEN to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # gh-pages pushes to the origin remote using the persisted GITHUB_TOKEN credentials.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy to GitHub Pages
        run: npm run deploy
